name: 🐛 bugfix
description: 버그를 발견하셨나요? 버그 리포트를 작성해주세요.
title: "[bugfix]: "
labels: ["bugfix"]
assignees:
  - Rose4tune
body:
  - type: markdown
    attributes:
      value: |
        버그 리포트를 작성해주셔서 감사합니다. 최대한 자세히 작성해주시면 문제 해결에 도움이 됩니다.

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발생한 버그에 대해 명확하고 간결하게 설명해주세요.
      placeholder: 어떤 문제가 발생했나요?

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 알려주세요.
      placeholder: |
        1. '...'로 이동
        2. '...' 클릭
        3. '...'까지 스크롤
        4. 오류 발생

  - type: textarea
    id: expected
    attributes:
      label: 예상된 동작
      description: 어떤 동작을 예상하셨나요?
      placeholder: 원래 어떻게 동작해야 하나요?

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떻게 동작했나요?
      placeholder: 실제로 어떤 일이 발생했나요?

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 가능하다면 스크린샷을 추가해주세요.
      placeholder: 스크린샷을 여기에 드래그하거나 붙여넣기 하세요.

  - type: dropdown
    id: browser
    attributes:
      label: 브라우저
      description: 어떤 브라우저에서 발생했나요?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
      multiple: true

  - type: input
    id: os
    attributes:
      label: 운영체제
      description: 어떤 운영체제를 사용하고 계신가요?
      placeholder: "예: macOS 14.0, Windows 11, Ubuntu 22.04"

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 이 버그와 관련된 다른 정보가 있나요?
      placeholder: 다른 추가 정보가 있다면 작성해주세요.
