name: ♻️ Refactor
description: 코드 리팩토링을 제안해주세요.
title: "[Refactor]: "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        리팩토링 제안을 해주셔서 감사합니다!

  - type: textarea
    id: target
    attributes:
      label: 리팩토링 대상
      description: 어떤 코드를 리팩토링하고 싶으신가요?
      placeholder: "예: src/components/Header.tsx의 상태 관리 로직"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 리팩토링 이유
      description: 왜 이 코드를 리팩토링해야 하나요?
      placeholder: |
        예:
        - 코드 가독성 개선
        - 중복 코드 제거
        - 성능 최적화
        - 유지보수성 향상
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 어떻게 리팩토링하면 좋을까요?
      placeholder: |
        예:
        - 커스텀 훅으로 분리
        - 컴포넌트를 더 작은 단위로 분해
        - 유틸리티 함수로 추출
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 리팩토링 범위
      options:
        - label: 단일 파일
        - label: 여러 파일
        - label: 전체 디렉토리
        - label: 아키텍처 변경

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - Low (낮음)
        - Medium (보통)
        - High (높음)
      default: 1

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 자료나 예시 코드가 있나요?
      placeholder: 관련 링크나 코드 스니펫을 공유해주세요.
