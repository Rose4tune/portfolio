name: ✨ feature
description: 새로운 기능이나 개선사항을 제안해주세요.
title: "[feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 해주셔서 감사합니다! 자세히 작성해주시면 검토에 도움이 됩니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 이 기능이 해결할 문제를 설명해주세요.
      placeholder: "현재 ... 할 때 불편함이 있습니다."

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결방법
      description: 원하는 기능이나 개선사항을 설명해주세요.
      placeholder: "... 기능이 추가되면 좋을 것 같습니다."

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려해본 다른 대안이 있나요?
      placeholder: "... 방법도 고려해봤습니다."

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 이 기능이 얼마나 중요한가요?
      options:
        - Low (낮음)
        - Medium (보통)
        - High (높음)
        - Critical (긴급)
      default: 1

  - type: checkboxes
    id: contribution
    attributes:
      label: 기여 의향
      description: 이 기능을 직접 구현하고 기여할 의향이 있으신가요?
      options:
        - label: PR을 제출할 수 있습니다
        - label: 테스트에 참여할 수 있습니다
        - label: 문서 작성을 도울 수 있습니다

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 이 기능과 관련된 다른 정보가 있나요?
      placeholder: 참고 자료나 예시가 있다면 공유해주세요.
