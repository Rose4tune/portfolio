name: ⚙️ setting files
description: 설정 파일 관련 이슈를 작성해주세요.
title: "[setting files]: "
labels: ["setting files"]
assignees:
  - Rose4tune
body:
  - type: markdown
    attributes:
      value: |
        설정 파일 관련 이슈를 작성해주셔서 감사합니다!

  - type: textarea
    id: target
    attributes:
      label: 대상 설정 파일
      description: 어떤 설정 파일에 대한 이슈인가요?
      placeholder: "예: package.json, tsconfig.json, .eslintrc 등"

  - type: dropdown
    id: type
    attributes:
      label: 이슈 유형
      options:
        - 설정 추가
        - 설정 수정
        - 설정 제거
        - 설정 오류
        - 기타

  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 설정 파일과 관련된 내용을 자세히 설명해주세요.
      placeholder: |
        예:
        - 새로운 패키지 의존성 추가 필요
        - TypeScript 컴파일 옵션 변경
        - ESLint 규칙 조정

  - type: textarea
    id: reason
    attributes:
      label: 이유
      description: 왜 이 변경이 필요한가요?
      placeholder: 이 설정 변경이 필요한 이유를 설명해주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고할 만한 다른 정보가 있나요?
      placeholder: 관련 문서나 예시를 공유해주세요.
